<html lang="en"><head><meta charset="utf-8">

<title>Town Dash: Places in the Community</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>

body{margin:0;min-height:100vh;font:500 1rem/1.45 "DM Sans",system-ui,sans-serif;color:var(--paper);background:radial-gradient(circle at 82% 8%,#fff6d6 0 22px,transparent 24px),radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 36% 9%,#fff,transparent),radial-gradient(1px 1px at 58% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff,transparent),radial-gradient(1px 1px at 26% 30%,#fff,transparent),linear-gradient(180deg,var(--n1),var(--n2) 85%);background-attachment:fixed;background-color:var(--n1)}

#app{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.scr{display:none}.scr.on{display:block}

.btn:hover{box-shadow:0 0 22px rgba(255,207,92,.55)}.btn:active{transform:scale(.97)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app">

<section id="home" class="scr on">
<h1 class="d">Town Dash<small>Places in the Community</small></h1>
<p>It is getting dark and the street lamps are still off. Answer at each of the 40 stops to light the way home. Five mistakes and the shops close.</p>
<div class="belt"><div id="belt"></div></div>
<div class="row"><button class="btn" id="go">Start walking</button><button class="btn ghost" id="lr">Study the shops first</button></div>
</section>

<section id="learn" class="scr"><div class="sheet">
<h2>Know the street</h2><p>Remember the pattern: <b>I am going to the ___ to ___.</b></p>
<div class="grid" id="lg"></div>
<div class="row"><button class="btn" id="go2">I’m ready</button><button class="btn ghost" id="bk">Back</button></div></div></section>

<section id="game" class="scr">
<div id="top"><span id="hp"></span><span id="sc"></span><span id="sk"></span></div>
<div id="track"></div><div id="bar"><i id="bi"></i></div>
<div class="sheet" id="q"><div id="pic"></div><div id="qb"><div id="qn"></div><div id="pr"></div><div id="ans"></div>
<div id="fb"><h2 id="fh"></h2><div id="ft"></div><button class="btn" id="nx" style="background:var(--ink);color:var(--paper);border-color:var(--ink)">Next stop</button></div></div></div>
</section>

<section id="end" class="scr"><div class="sheet">
<div id="stars"></div><h2 id="et"></h2><p id="es"></p>
<div class="rv" id="rv"></div>
<div class="row" style="justify-content:center"><button class="btn" id="again" style="background:var(--ink);color:var(--paper);border-color:var(--ink)">Walk again</button><button class="btn ghost" id="menu">Main menu</button></div></div></section>
</div>
<script>
const P=[['school','to study'],['bank','to save money'],['supermarket','to buy vegetables and milk'],['market','to buy fresh fish'],['mall','to buy new shoes'],['convenience store','to buy snacks and a drink'],['zoo','to see the animals'],['park','to jog and play'],['farm','to buy fresh eggs'],['bakery','to buy bread and cake'],['hair salon','to get a haircut'],['bookshop','to buy a storybook'],['toy store','to buy a robot']];

function shop(i,label){const c=C[i%13],r=i%3,y=r==1?50:60,h=r==1?110:100;let s=`<svg class="shop" viewBox="0 0 200 170"><rect x="0" y="160" width="200" height="10" fill="#181c52"/><rect x="20" y="${y}" width="160" height="${h}" rx="3" fill="${c}"/>`;
s+=r==1?`<path d="M12 52L100 12L188 52Z" fill="#0b1030" opacity=".6"/>`:r==2?`<rect x="74" y="22" width="52" height="44" fill="${c}"/><rect x="68" y="14" width="64" height="9" fill="#0b1030" opacity=".6"/>`:`<rect x="12" y="52" width="176" height="10" fill="#0b1030" opacity=".6"/>`;
for(let k=0;k<8;k++)s+=`<rect x="${20+k*20}" y="100" width="20" height="16" fill="${k%2?'#f4f2ff':'#0b1030'}" opacity="${k%2?1:.55}"/>`;
s+=`<rect x="38" y="68" width="124" height="26" rx="5" fill="#0b1030"/><text class="sg" x="100" y="86" text-anchor="middle" font-size="${label.length>9?12:15}">${label}</text>`;
s+=`<rect x="32" y="124" width="36" height="26" rx="2" fill="#ffe9a8"/><rect x="132" y="124" width="36" height="26" rx="2" fill="#ffe9a8" opacity=".85"/><rect x="50" y="124" width="1.5" height="26" fill="${c}"/><rect x="150" y="124" width="1.5" height="26" fill="${c}"/><rect x="86" y="122" width="28" height="38" rx="3" fill="#0b1030"/><circle cx="107" cy="142" r="2" fill="#ffcf5c"/></svg>`;return s}
const bubble=m=>`<svg class="shop" viewBox="0 0 200 170"><path d="M30 24h140a10 10 0 0 1 10 10v74a10 10 0 0 1-10 10H92l-30 28v-28H30a10 10 0 0 1-10-10V34a10 10 0 0 1 10-10z" fill="#f4f2ff"/><text x="100" y="92" text-anchor="middle" font-size="56" font-weight="800" font-family="Bricolage Grotesque,sans-serif" fill="#14183a">${m}</text></svg>`;
const Q=[
{s:1,p:'You keep and save your money here. Which place is it?',o:['bank','bakery','bookshop','school'],a:0,e:'We save money at the bank.'},
{s:9,p:'I am going to the ___ to buy bread and cake.',o:['farm','bakery','zoo','park'],a:1,e:'Bread and cake come from the bakery.'},
{k:'o',s:2,p:'Build the sentence:',a:'I am going to the supermarket to buy some milk',e:'Pattern: I am going to the + place + to buy + thing.'},
{s:10,p:'“Where are you going?” Choose the best answer.',o:['I am going to the hair salon to get a haircut.','I going to hair salon for cut hair.','I am go to the hair salon to haircut.','I am going hair salon to get haircut.'],a:0,e:'Use am going + to the + place, then to + verb.'},
{k:'t',s:6,p:'Lions, monkeys and elephants live here. Type the place (one word).',a:['zoo'],e:'We go to the zoo to see the animals.'},
{s:4,p:'It is one very big building with many shops, a food court and a cinema. Where is it?',o:['market','convenience store','mall','farm'],a:2,e:'A mall has many shops under one roof.'},
{s:5,p:'Mia is thirsty at 11 p.m. She needs a snack and a drink from a small shop that is open 24 hours. Where does she go?',o:['supermarket','convenience store','bookshop','bank'],a:1,e:'A convenience store is small and often open all night.'},
{s:12,p:'Dino is going to the ___ to buy a robot and a doll.',o:['toy store','bakery','hair salon','school'],a:0,e:'Toys are sold at the toy store.'},

{k:'t',s:3,p:'People sell fresh vegetables and fish in stalls here. You can bargain! Type the place (one word).',a:['market','traditional market'],e:'The market has stalls, and we can bargain there.'},
{s:-1,m:'?',p:'Odd one out: which place is NOT used for buying things?',o:['bakery','park','toy store','bookshop'],a:1,e:'We go to the park to relax and play, not to buy.'},
{s:0,p:'I am going to the ___ to study with my friends.',o:['school','bakery','mall','market'],a:0,e:'We study at school.'},
{s:8,p:'Farmers grow rice and raise cows and chickens here. Where is it?',o:['farm','park','zoo','market'],a:0,e:'A farm is where farmers grow crops and raise animals.'},
{k:'o',s:7,p:'Build the sentence:',a:'We are going to the park to play football',e:'With we, use are going.'},
{s:2,p:'Which sentence is correct?',o:['My mother is going to the supermarket to buy vegetables.','My mother are going to the supermarket to buy vegetables.','My mother going to supermarket buy vegetables.','My mother is go to the supermarket to buy vegetables.'],a:0,e:'My mother = she, so we use is going.'},
{k:'t',s:9,p:'You can smell fresh bread and cakes here. Type the place (one word).',a:['bakery'],e:'We buy bread and cake at the bakery.'},
{s:-1,m:'“ ”',p:'“Excuse me, is there a bookshop near here?” Choose the best reply.',o:['Yes, there is. It is across from the park.','Yes, I am bookshop.','No, I buy a book.','It is going to the bookshop.'],a:0,e:'Answer Is there...? with Yes, there is / No, there is not.'},

{k:'t',s:12,p:'Children buy dolls, robots and puzzles here. Type the place (two words).',a:['toy store','toy shop'],e:'Toys are sold at the toy store.'},
{s:4,p:'Dad and I are going to the ___ to watch a movie and buy new shoes.',o:['mall','farm','bakery','bank'],a:0,e:'A mall has a cinema and many shops.'},
{s:2,p:'Budi has a list: rice, eggs, cooking oil and soap. He wants to buy everything in one place. Where should he go?',o:['supermarket','bakery','toy store','zoo'],a:0,e:'A supermarket sells many kinds of goods under one roof.'},
{s:11,p:'Sinta needs a dictionary and a notebook. “I am going to the ___ to buy them.”',o:['bookshop','bakery','hair salon','zoo'],a:0,e:'Books and stationery are sold at the bookshop.'},
{k:'o',s:1,p:'Build the sentence:',a:'My father is going to the bank to save money',e:'My father = he, so we use is going.'},
{s:-1,m:'?',p:'Find the mistake: “I am going to the bakery for buy some bread.”',o:['for buy → to buy','am going → is going','the bakery → bakery','some bread → bread some'],a:0,e:'For purpose we say to + base verb: to buy.'},
{s:-1,m:'“ ”',p:'Shopkeeper: “May I help you?” You want a notebook. Choose the best reply.',o:['Yes, please. I would like to buy a notebook.','Yes, I am a notebook.','No, I go notebook.','The notebook is going to me.'],a:0,e:'Use I would like to buy... to ask politely.'},
{k:'t',s:7,p:'Children play on swings and slides here, and people jog under the trees. Type the place (one word).',a:['park'],e:'We go to the park to jog and play.'},
{s:8,p:'I have cows, chickens and rice fields. I am not a zoo. What am I?',o:['farm','park','market','mall'],a:0,e:'A farm is where food is grown and animals are raised.'},
{k:'o',s:5,p:'Build the sentence:',a:'We are going to the convenience store to buy a drink',e:'We + are going + to the + place + to buy.'},
{s:-1,m:'?',p:'Which pair is matched correctly?',o:['bank – save money','zoo – buy bread','hair salon – watch animals','bookshop – get a haircut'],a:0,e:'We save money at the bank.'},
{s:6,p:'Which sentence is correct?',o:['We are going to the zoo to see the animals.','We are going to zoo for see animals.','We going to the zoo to seeing animals.','We are go to the zoo to see animals.'],a:0,e:'are going + to the zoo + to see.'},
{k:'t',s:11,p:'You can buy novels, comics and dictionaries here. Type the place (one word).',a:['bookshop','bookstore','book shop'],e:'Books are sold at the bookshop.'},
{s:-1,m:'“ ”',p:'“Where is the hair salon?” – “It is ___ the bank and the bakery.” Choose the best word.',o:['between','to','for','of'],a:0,e:'We say between X and Y.'},

{s:4,p:'A mall is different from a market because ___.',o:['a mall is a big building with many shops and fixed prices','a mall is where farmers grow rice','a mall is only for saving money','a mall sells only fish in stalls'],a:0,e:'A mall is a large modern shopping building.'}];
const $=i=>document.getElementById(i),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

$('qn').textContent=`Stop ${i+1} of ${Q.length}`+(q.k=='o'?' · build the sentence':q.k=='t'?' · type the answer':'');$('pr').textContent=q.p;const A=$('ans');A.innerHTML='';lim=q.k?45:25;

else if(q.k=='o'){const s=document.createElement('div');s.className='slot';const pool=document.createElement('div');pool.className='pool';A.append(s,pool);

else{const inp=document.createElement('input');inp.className='ty';inp.placeholder='Type here…';inp.autocomplete='off';const c=document.createElement('button');c.className='btn';c.textContent='Check';

t0=Date.now();tm=setInterval(()=>{const l=lim-(Date.now()-t0)/1000;$('bi').style.width=Math.max(0,l/lim*100)+'%';$('bi').style.background=l<8?'var(--pink)':'var(--lamp)';if(l<=0)fin(false,null,true)},100)}
function fin(ok,el,late){if(done)return;done=true;clearInterval(tm);const q=Q[i],left=Math.max(0,lim-(Date.now()-t0)/1000);
document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.c==1)b.classList.add('ok');else if(b===el)b.classList.add('no')});
document.querySelectorAll('#ans .tk,#ans .btn,#ans input').forEach(x=>x.disabled=true);
if(q.s>=0){const t=$('pic').querySelector('text.sg');t.textContent=P[q.s][0];t.setAttribute('font-size',P[q.s][0].length>9?12:15)}
let g=0;if(ok){sk++;g=100+Math.round(left*3)+(sk>1?(sk-1)*20:0);sc+=g;beep(660,.12);setTimeout(()=>beep(880,.15),110)}else{sk=0;hp--;beep(180,.3);$('ans').classList.add('shake');setTimeout(()=>$('ans').classList.remove('shake'),400)}
log.push({q,ok});$('fb').classList.toggle('bad',!ok);
$('fh').textContent=ok?`Correct, +${g}`:late?'Time ran out':'Not this time';
$('ft').textContent=(!ok&&q.k=='o'?'Answer: '+q.a+'. ':!ok&&q.k=='t'?'Answer: '+q.a[0]+'. ':'')+q.e;
$('nx').textContent=hp<=0||i==Q.length-1?'See results':'Next stop';$('fb').classList.add('on');hud()}
$('nx').onclick=()=>{if(hp<=0||i==Q.length-1)end();else{i++;render()}};
function end(){const n=log.filter(l=>l.ok).length,win=hp>0&&log.length==Q.length;
$('et').textContent=win?'Every lamp on the street is lit.':'The shops closed early.';
const r=n/Q.length,st=r>=.9?3:r>=.7?2:r>=.45?1:0;$('stars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
$('es').textContent=`${n} of ${Q.length} correct · ${sc} points`;
$('rv').innerHTML=log.map(l=>`<div><em class="${l.ok?'':'x'}">${l.ok?'✓':'✗'}</em>${l.q.p}${l.ok?'':' <b>→ '+(l.q.k=='o'?l.q.a:l.q.k=='t'?l.q.a[0]:l.q.o[l.q.a])+'</b>'}</div>`).join('');show('end')}
</script></body></html>
